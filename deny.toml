# --- Named exceptions -------------------------------------------------------
# Real-world awkward cases in this tree. Keep this list short and justified.

# walkdir / same-file (via `ignore` and `globset`) declare the non-standard,
# pre-SPDX spelling "Unlicense/MIT" -- i.e. Unlicense OR MIT written with a
# slash instead of OR. Both branches are in the core allowlist.
[[licenses.exceptions]]
name = "walkdir"
allow = ["Unlicense", "MIT"]

[[licenses.exceptions]]
name = "same-file"
allow = ["Unlicense", "MIT"]

# encoding_rs (via htmd) is the CONJUNCTIVE
# "(Apache-2.0 OR MIT) AND BSD-3-Clause": both halves are required, unlike the
# usual disjunctive Rust dual-license. It already satisfies the core allowlist;
# the exception is spelled out so that a future BSD-3-Clause removal fails
# loudly here instead of silently dropping the crate out of coverage.
[[licenses.exceptions]]
name = "encoding_rs"
allow = ["Apache-2.0", "MIT", "BSD-3-Clause"]

# csv (BurntSushi) declares the same non-standard "Unlicense/MIT" spelling as
# walkdir/same-file -- verified on crates.io (csv 1.4.0, 2026-09-29). csv is
# NOT currently in this dependency graph; the exception is declared so the
# policy is written down before it is pulled in, and cargo-deny will report it
# as an unused exception until then.
[[licenses.exceptions]]
name = "csv"
allow = ["Unlicense", "MIT"]

# notify is CC0-1.0 (verified on crates.io, notify 9.0.0-rc.5). No exception is
# needed -- CC0-1.0 is already in the core allowlist above. Recorded here for
# the policy record: CC0-1.0 is a PUBLIC-DEDICATION license, not an OSI-approved
# one, and unlike Apache-2.0 it carries NO express patent grant. notify is also
# not currently in this dependency graph.

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Add targeted bans here as `[[bans.deny]]` entries, e.g.
# [[bans.deny]]
# name = "openssl"

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
# cargo-deny 0.20 restructured this table:
#   * `vulnerability` and `notice` were REMOVED -- every vulnerability
#     advisory now errors unconditionally. The intended
#     "vulnerability = deny" is therefore expressed by OMISSION: there is no
#     key to set and no way to downgrade it to warn.
#   * `unmaintained` / `unsound` lost the `warn` severity and now take only a
#     scope (`all` | `workspace` | `transitive` | `none`), where `workspace`
#     means "fail only if a crate we own is affected".
#
# `workspace` is the closest available equivalent of the intended
# "warn on day one" setting: the tree is reported to be non-fatal on these
# findings instead of turning CI red immediately. Known findings that this
# scope deliberately leaves non-fatal today, for escalation once fixed:
#   * RUSTSEC  unmaintained : proc-macro-error2        (`unmaintained = all` -> fail)
#   * RUSTSEC-2026-0306     : faster-hex 0.10.0 unsound (`unsound = all` -> fail)
#   * RUSTSEC-2026-0253     : lru 0.16.4 unsound        (`unsound = all` -> fail)
# Escalate each to the wider scope when its upstream fix lands.
[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
