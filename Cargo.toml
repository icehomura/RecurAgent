[workspace]
resolver = "2"
# `tui/` is its own workspace (the RecurAgent terminal client ships and releases on its
# own cadence, like upstream's ra-tui); it path-depends on crates/ra-core.
exclude = ["tui"]
members = [
    "crates/ra-core",
    "crates/ra-diagnostics",
    "crates/ra-research",
    "crates/ra-memory",
    "crates/ra-llm",
    "crates/ra-agent",
    "crates/ra-bus",
    "crates/ra-workflows",
    "crates/ra-server",
    "crates/ra-store",
    "crates/ra-services",
    "crates/ra-cli",
    "crates/app-skills/news",
    "crates/app-skills/deep-search",
    "crates/app-skills/deep-crawl",
    "crates/app-skills/send-email",
    "crates/app-skills/account-manager",
    "crates/app-skills/time",
    "crates/app-skills/weather",
    "crates/app-skills/smart-home",
    "crates/app-skills/wechat-bridge",
    "crates/app-skills/skill-evolve",
    "crates/app-skills/harness-starter-generic",
    "crates/app-skills/harness-starter-report",
    "crates/app-skills/harness-starter-audio",
    "crates/app-skills/harness-starter-coding",
    "crates/platform-skills/voice",
    "crates/ra-dora-mcp",
    "crates/ra-pipeline",
    "crates/ra-plugin",
    "crates/ra-sandbox",
    "crates/ra-swarm",
    "crates/ra-fleet",
    "crates/ra-fleet-worker",
    "crates/ra-embed-llama",
    "crates/ra-ffi",
    "crates/ra-uniffi",
    "crates/ra-wasm",
    "crates/ra-pyo3",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["RecurAgent team"]
license = "Apache-2.0"
repository = "https://github.com/icehomura/ra"
[workspace.lints.rust]
unsafe_code = "deny"
[workspace.dependencies]
# #2234/45c — echo-free interactive secret input (safe termios wrapper; the workspace denies unsafe_code, blocking a hand-rolled termios arm)
rpassword = "7"
# Internal crates
ra-core = { path = "crates/ra-core" }
ra-diagnostics = { path = "crates/ra-diagnostics" }
ra-research = { path = "crates/ra-research" }
ra-memory = { path = "crates/ra-memory" }
ra-llm = { path = "crates/ra-llm" }
ra-agent = { path = "crates/ra-agent" }
ra-bus = { path = "crates/ra-bus" }
ra-workflows = { path = "crates/ra-workflows" }
ra-server = { path = "crates/ra-server" }
ra-store = { path = "crates/ra-store" }
ra-services = { path = "crates/ra-services" }
ra-pipeline = { path = "crates/ra-pipeline" }
ra-plugin = { path = "crates/ra-plugin" }
ra-swarm = { path = "crates/ra-swarm" }
ra-fleet = { path = "crates/ra-fleet" }
ra-fleet-worker = { path = "crates/ra-fleet-worker" }
ra-embed-llama = { path = "crates/ra-embed-llama" }
# The Codex crates (codex-execpolicy / codex-state / codex-file-search /
# codex-linux-sandbox) were declared here as git deps of github.com/openai/codex.
# Nothing referenced them — every use site was commented out "enable when codex
# builds" — and a git dependency on a foreign repository is exactly what this
# fork avoids, so the declarations are gone. To bring that integration back,
# depend on your own hub's path/registry copies from ra-agent and ra-memory.
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
base64 = "0.22"
# Crypto
md-5 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
# JWT signing for Google service-account (Vertex AI) auth. Uses `ring`
# (already in tree via rustls) for RS256 — no OpenSSL.
jsonwebtoken = "9"
# Error handling (dora-rs pattern)
eyre = "0.6"
color-eyre = "0.6"
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
dirs = "5"
rustyline = "15"
semver = "1"
open = "5"
# Keychain (platform-native secure credential storage)
keyring = { version = "3", default-features = false }
# HTTP client (using rustls for pure Rust, no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking", "multipart"] }
htmd = "0.5"
# Match the parser already used by htmd for plain-text DOM extraction.
html5ever = "0.35"
markup5ever_rcdom = "0.35"
# Database (pure Rust)
redb = "2"
# Keep the fleet ledger's checked u64/usize conversions on the 0.40 bindings.
# This dependency requires Rust 1.88 or newer; the workspace MSRV is still stale.
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
bincode = "1"
# Vector search
hnsw_rs = "0.3"
# Git (native, feature-gated)
gix = { version = "0.79", default-features = false, features = ["max-performance-safe", "revision", "blob-diff"] }
# AST parsing (feature-gated)
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
# Diff
similar = "2"
# Office file manipulation (DOCX/PPTX/XLSX are ZIP+XML)
zip = "2"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# PDF text extraction (pure Rust; read_file auto-detects %PDF- magic)
pdf-extract = "0.9"
# Audio decoding (pure Rust)
# WAV: always-on (small dep, used by AudioNonSilent validator on .wav files).
# MP3: gated behind the `audio_mp3` feature on ra-agent so non-audio
# workspaces don't pay the symphonia dep cost. Without the feature, MP3
# AudioNonSilent validators return an explicit "feature not enabled" error
# rather than silently passing.
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
# Unix-specific (O_NOFOLLOW for symlink-safe file I/O)
libc = "0.2"
# Safe openat/mkdirat for the #1976 write-grant component-wise confined walk
# (closes the ancestor-symlink TOCTOU under the workspace-wide deny(unsafe_code)
# lint — rustix wraps the raw syscalls in a safe API). Already vendored
# transitively; pinned here as a direct dep of ra-agent.
rustix = { version = "1", features = ["fs"] }
# LRU cache
lru = "0.16"
# File search
glob = "0.3"
globset = "0.4"
regex = "1"
ignore = "0.4"
# Cron expressions
cron = "0.15"
# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# Async utilities
futures = "0.3"
# Browser automation
chromiumoxide = "0.9"
which = "7"
# Channel integrations (optional, pulled in via feature flags)
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
serenity = { version = "0.12", default-features = false, features = ["rustls_backend", "gateway", "client", "http", "model"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# Email channel (optional)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mailparse = "0.16"
# Web API (optional)
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = "8"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Archive extraction
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
chacha20poly1305 = "0.10"
argon2 = "0.5"
tar = "0.4"
tower = { version = "0.5", features = ["util"] }
# URL parsing
url = "2"
# Testing
tokio-test = "0.4"
tempfile = "3"
proptest = "1.11"
wiremock = "0.6"
# -- Release configuration --------------------------------------------------
[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "chore: release {{version}}"
pre-release-hook = ["git-cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]
publish = false

# -- Build profiles -----------------------------------------------------------
# Keep dev builds small: line tables are enough for backtraces, dependencies
# get no debug info, and incremental caches are disabled (they grow unbounded).
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
