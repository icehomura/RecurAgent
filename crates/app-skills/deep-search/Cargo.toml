[package]
name = "deep-search"
version = "2.0.0"
edition = "2021"
description = "Deep multi-round web research: iterative search, parallel crawling, reference chasing"
authors = ["ra"]

[[bin]]
name = "deep-search"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
ego-tree = "0.10"
regex = "1"
url = "2"
chrono = "0.4"
# `impersonate`: results-page engines that need a browser-like client
# (Google, as SearXNG does). `browser`: engines that render load in the
# ra browser profile when RA_BROWSER is set.
ra-research = { path = "../../ra-research", features = ["http", "browser", "impersonate"] }
# Product identity: `RA_WORK_DIR`/`RA_EVENT_SINK`/`RA_SESSION_ID`/`RA_TASK_ID`
# win over the legacy `OCTOS_*` spellings the parent may still forward.
ra-core = { path = "../../ra-core" }

[package.metadata.release]
release = false
