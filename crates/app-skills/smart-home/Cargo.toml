[package]
name = "smart-home"
version = "1.1.0"
edition = "2021"
description = "Standalone smart-home skill: list and control devices via the profile's configured bridge"
authors = ["ra"]

[[bin]]
name = "smart_home"
path = "src/main.rs"

[dependencies]
# Product identity: `RA_HOME`/`RA_PROFILE_ID` win over the legacy `RA_*`
# spellings, and the state home resolves with the legacy fallback.
ra-core = { path = "../../ra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.release]
release = false
