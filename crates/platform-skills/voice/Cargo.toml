[package]
name = "voice"
version = "1.2.0"
edition = "2021"
description = "Voice skill binary with external ASR routing and OMiniX TTS/model management"
authors = ["ra"]

[[bin]]
name = "voice"
path = "src/main.rs"

[dependencies]
# Product identity: `RA_WORK_DIR` wins over the legacy `RA_WORK_DIR`.
ra-core = { path = "../../ra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json", "multipart"], default-features = false }
base64 = "0.22"

[package.metadata.release]
release = false
