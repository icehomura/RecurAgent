[package]
name = "ra-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-contained persistence/state stores for ra (extracted from ra-cli)"

[dependencies]
ra-core = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
redb = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# Secure token generation/comparison in `admin_token_store` (version-pinned in
# ra-cli, not workspace deps).
getrandom = "0.2"
constant_time_eq = "0.3"

[features]
# Exposes test-only helpers (e.g. `approvals_audit::read_audit_lines`) to
# downstream crates' test builds. Never enable in production.
test-util = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
