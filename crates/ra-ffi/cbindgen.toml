# cbindgen config for the ra-ffi C header.
#
# Regenerate the committed header with:
#   cbindgen --config crates/ra-ffi/cbindgen.toml \
#            --crate ra-ffi \
#            --output crates/ra-ffi/include/ra.h
language = "C"
pragma_once = true
include_guard = "RA_FFI_H"
cpp_compat = true
style = "type"
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen. DO NOT EDIT. Regenerate with the command in crates/ra-ffi/cbindgen.toml. */"
header = """
/*
 * ra-ffi C API.
 *
 * OWNERSHIP & SAFETY CONTRACT:
 *  - An RaRuntime* is NOT thread-safe. Serialize all calls on a handle.
 *    Never use a handle after ra_runtime_free(); never free it twice or
 *    concurrently with any other call on the same handle. Free it from a plain
 *    (non-async) thread.
 *  - Strings returned by ra_run_task()/ra_embed()/ra_memory_*()/
 *    ra_embedding_model_*() or ra_take_last_partial_result() are owned by YOU and
 *    must be freed, UNMODIFIED, with ra_string_free() -- never free(3),
 *    never twice, and do not alter the bytes or NUL terminator before freeing.
 *  - const char* from ra_last_error()/ra_version() must NOT be freed.
 *    ra_last_error() is thread-local and valid only until the next FFI call
 *    on the same thread.
 */"""

[parse]
# Only parse this crate's own items; the C surface is self-contained.
parse_deps = false

[export]
# `RaRuntime` has no #[repr(C)] and only private fields, so cbindgen emits it
# as an opaque forward declaration — exactly the intended handle type.
item_types = ["functions", "structs", "opaque"]

[fn]
sort_by = "None"
