[package]
name = "ra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP/WebSocket API server + session runtime for ra (extracted from ra-cli). Server-core is ungated; the HTTP layer is behind the `api` feature."

[dependencies]
# --- ungated server-core: the session actor + gateway runtime build WITHOUT the
# `api` feature (non-API `ra gateway` needs them). ---
ra-core = { workspace = true }
ra-agent = { workspace = true }
ra-llm = { workspace = true }
ra-bus = { workspace = true }
ra-store = { workspace = true }
ra-services = { workspace = true }
ra-workflows = { workspace = true }
ra-pipeline = { workspace = true }
ra-plugin = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }

# --- HTTP/WS layer, gated behind `api` (mirrors ra-cli's `api` optional deps) ---
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio-util = { version = "0.7", optional = true }
futures = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sysinfo = { version = "0.34", optional = true }
subtle = { workspace = true, optional = true }

[features]
default = []
# HTTP/WS API layer. Mirrors ra-cli's `api` feature; ra-cli's `api` will
# forward here in Stage 4. `matrix` is required — handlers reference matrix types.
api = [
    "dep:axum",
    "dep:tower-http",
    "dep:tokio-util",
    "dep:futures",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rust-embed",
    "dep:metrics-exporter-prometheus",
    "dep:lettre",
    "dep:rand",
    "dep:sysinfo",
    "dep:subtle",
    "ra-bus/api",
    "matrix",
]
# Channel features forward to ra-bus (the gateway runtime dispatches them
# without the HTTP `api` layer).
matrix = ["ra-bus/matrix"]
telegram = ["ra-bus/telegram"]
discord = ["ra-bus/discord"]
dingtalk = ["ra-bus/dingtalk"]
slack = ["ra-bus/slack"]
whatsapp = ["ra-bus/whatsapp"]
email = ["ra-bus/email"]
feishu = ["ra-bus/feishu"]
twilio = ["ra-bus/twilio"]
wecom = ["ra-bus/wecom"]
line = ["ra-bus/line"]
wecom-bot = ["ra-bus/wecom-bot"]
qq-bot = ["ra-bus/qq-bot"]
wechat = ["ra-bus/wechat"]

[lints]
workspace = true
