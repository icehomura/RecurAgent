  #           ghcr.io/${{ github.repository }}:latest
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  package-publishers:
    name: Publish npm and Homebrew packages
    needs: verify-release
    if: ${{ !failure() && !cancelled() && needs.verify-release.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
