name: Release

# OFFICIAL release flow — fires ONLY for a pushed `v*` tag (or a manual
# dispatch that supplies a tag). `tags: ['v*']` matches tag refs only, so
# pushing an untagged commit to main NEVER starts this workflow; that push
# runs build-latest.yml instead. The two flows are mutually exclusive per push.
#
# Builds all three variants (ra, ra-headless, ra-full) × all four targets via
# the reusable build-variants.yml, then publishes the full asset set and
# verifies it after the fact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = full release)'
        required: true
        type: choice
        default: all
        options: [all, macos-arm, linux-x86, linux-arm, windows, docker]
      tag:
        description: 'Tag to release (e.g. v0.1.2-rc5). Required for publish.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Compare release tag and Cargo workspace version
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match workspace version v$version"
            exit 1
          fi

  build:
    name: Build release variants
    needs: check-version
    # The variant × target matrix (ra, ra-headless, ra-full × the four release
    # triples), per-target `runs-on` images and the bundle recipes all live in
    # the reusable workflow. On a tag push every target is built; a manual
    # dispatch can restrict the build to one platform.
    permissions:
      contents: read
    uses: ./.github/workflows/build-variants.yml
    with:
      # On workflow_dispatch for a specific tag, build THAT tag — otherwise we
      # build main's HEAD but publish under the tag.
      ref: ${{ inputs.tag || github.ref }}
      platform: ${{ inputs.platform || 'all' }}

  publish:
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Every variant × target bundle plus its .sha256 sidecar. A
          # platform-restricted dispatch only produced that platform's
          # artifacts, so only those get published.
          find artifacts -type f -name '*-bundle-*' -exec cp {} release-assets/ \;
          # Always include install scripts
          cp scripts/install.sh scripts/install.ps1 scripts/deploy.ps1 scripts/ra-doctor.sh release-assets/
          echo "Assets to upload:"
          ls -la release-assets/

      - name: Detect pre-release
        id: prerelease
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if echo "$TAG" | grep -qE '[-](rc|alpha|beta|dev|preview|test|macos|linux|win)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: release-assets/*
          body_path: RELEASE_NOTES.md

  verify-release:
    name: Verify GitHub release assets
    needs: publish
    if: ${{ !failure() && !cancelled() && needs.publish.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify complete release and readable archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          # The bundles the run was supposed to publish: all three variants
          # for every target the dispatch selected.
          case "$PLATFORM" in
            all)       triples="aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-pc-windows-msvc" ;;
            macos-arm) triples="aarch64-apple-darwin" ;;
            linux-x86) triples="x86_64-unknown-linux-gnu" ;;
            linux-arm) triples="aarch64-unknown-linux-gnu" ;;
            windows)   triples="x86_64-pc-windows-msvc" ;;
            *)         echo "::error::unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          expected=()
          for triple in $triples; do
            ext=tar.gz
            case "$triple" in *windows-msvc) ext=zip ;; esac
            for variant in ra ra-headless ra-full; do
              expected+=("${variant}-bundle-${triple}.${ext}" "${variant}-bundle-${triple}.${ext}.sha256")
            done
          done
          expected+=(install.sh install.ps1 deploy.ps1 ra-doctor.sh)

          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "${expected[@]}"; do
            echo "$actual" | grep -Fx "$asset" >/dev/null \
              || { echo "::error::release $TAG is missing $asset"; exit 1; }
          done

          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ra-bundle-*' \
            --pattern 'ra-headless-bundle-*' \
            --pattern 'ra-full-bundle-*' \
            --dir verify
          # Every published sidecar must match the published bytes — this is
          # the exact verification ra-tui's auto-install performs (#1929).
          # Darwin sidecars are produced by shasum, the rest by sha256sum, so
          # checking every downloaded sidecar covers both producer paths.
          (cd verify && sha256sum -c ./*.sha256)

          # Readable archives, and the variant split really holds: ra-full
          # carries the dashboard-embedded ra plus ra-tui, ra-headless is the
          # kernel-only build.
          for archive in verify/*.tar.gz; do
            [ -e "$archive" ] || continue
            tar -tzf "$archive" >/dev/null
          done
          # Bundles are created with `tar czf … ./*` / `7z a … ./*`, so tar
          # entries carry a `./` prefix — accept either form. `tr -d '\r'`
          # keeps the match working on runners whose tar prints CRLF.
          case " $triples " in
            *" x86_64-unknown-linux-gnu "*)
              tar -tzf verify/ra-full-bundle-x86_64-unknown-linux-gnu.tar.gz | tr -d '\r' | grep -qE '(^|/)ra-tui$' \
                || { echo "::error::ra-full bundle is missing ra-tui"; exit 1; }
              tar -tzf verify/ra-headless-bundle-x86_64-unknown-linux-gnu.tar.gz | tr -d '\r' | grep -qE '(^|/)ra$' \
                || { echo "::error::ra-headless bundle is missing the ra kernel"; exit 1; }
              ;;
          esac
          case " $triples " in
            *" x86_64-pc-windows-msvc "*)
              unzip -l verify/ra-full-bundle-x86_64-pc-windows-msvc.zip | tr -d '\r' | grep -qE 'ra-tui\.exe$' \
                || { echo "::error::ra-full bundle is missing ra-tui.exe"; exit 1; }
              ;;
          esac

