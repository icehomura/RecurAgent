services:
  # ─────────────────────────────────────────────
  # ra Chat (one-shot query)
  #   docker compose --profile agent run --rm ra-agent -m "Hello"
  # ─────────────────────────────────────────────
  ra-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ra-agent
    profiles:
      - agent
    volumes:
      - ./.ra/config.json:/root/.ra/config.json:ro
      - ra-workspace:/root/.ra
    entrypoint: ["ra", "chat"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # ra Gateway (long-running bot)
  #   docker compose --profile gateway up -d
  # ─────────────────────────────────────────────
  ra-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ra-gateway
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      - ./.ra/config.json:/root/.ra/config.json:ro
      - ra-workspace:/root/.ra
    command: ["gateway"]

volumes:
  ra-workspace:
