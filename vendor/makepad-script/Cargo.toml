# Vendored from https://github.com/OctoSense-org/makepad at
# 6e5898fecbe5931c16fb7b1e54357104dd54e825 (see ../PROVENANCE.md).
# Changes vs upstream: sibling crates are path deps into this tree; the
# `[dev-dependencies]`/`[[bench]]`/`[workspace]` sections and the upstream
# `[workspace.package]` inheritance are dropped (none applied to the lib).
[package]
name = "makepad-script"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad script (splash)"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "yK9xdn_D0D3EdqleI-WHLtjk4rk="

[features]
default = ["check_gen"]
check_gen = []

[dependencies]
makepad-error-log = { path = "../makepad-error-log", version = "1.0.0" }
makepad-stitch = { path = "../makepad-stitch", version = "0.1.0" }
makepad-math = { path = "../makepad-math", version = "1.0.0" }
makepad-live-id = { path = "../makepad-live-id", version = "1.0.0" }
makepad-script-derive = { path = "../makepad-script-derive", version = "1.0.0" }
smallvec = { path = "../smallvec", version = "1.15" }
makepad-regex = { path = "../makepad-regex", version = "0.1.0" }
makepad-html = { path = "../makepad-html", version = "1.0.0" }
