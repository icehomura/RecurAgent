# Workspace for the crates vendored under `vendor/` for `ra-research`'s
# `metasearch` feature (OctoScript core + the Makepad VM it re-exports).
#
# Keeping them in their own workspace lets the tree be inspected/built
# standalone; the root workspace pulls them in as path dependencies.
[workspace]
resolver = "2"
members = [
    "octoscript-core",
    "octoscript-ui-l0",
    "makepad-script",
    "makepad-script-derive",
    "makepad-error-log",
    "makepad-stitch",
    "makepad-math",
    "makepad-live-id",
    "makepad-live-id-macros",
    "makepad-micro-proc-macro",
    "makepad-micro-serde",
    "makepad-micro-serde-derive",
    "makepad-regex",
    "makepad-html",
    "smallvec",
]
