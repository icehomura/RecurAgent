# Workspace for the third-party crates vendored under `vendor/` so the build
# needs no foreign git dependency: the Rascript core + the Makepad VM it
# re-exports (for `ra-research`'s `metasearch` feature) and the `ttfx` splash
# engine used by the terminal client.
#
# Keeping them in their own workspace lets the tree be inspected/built
# standalone; the root workspace pulls them in as path dependencies.
[workspace]
resolver = "2"
members = [
    "rascript-core",
    "rascript-ui-l0",
    "makepad-script",
    "makepad-script-derive",
    "makepad-error-log",
    "makepad-stitch",
    "makepad-math",
    "makepad-live-id",
    "makepad-live-id-macros",
    "makepad-micro-proc-macro",
    "makepad-micro-serde",
    "makepad-micro-serde-derive",
    "makepad-regex",
    "makepad-html",
    "smallvec",
    "ttfx",
]
