  zh-CN: "\n警告：不再推荐使用 Anthropic OAuth（Claude Code 消费者账户）。\n在官方客户端之外使用消费者 OAuth 令牌可能违反 Anthropic 消费者服务条款，并可能导致账户被暂停或封禁。请改用 Anthropic API 密钥（ANTHROPIC_API_KEY）。\n"

