# ── RESERVED: status_line machine prefixes (optional translation) ───────
#
# These are the compact machine labels a status line draws — `git:`, `ctx:`,
# `think:`, `agents:`, `session:`, and the `tok` unit. They are NOT prose, and
# the glyphs that carry them (``, `󰭻`, the separators) must never enter a
# translation: `StatusSegment::render_with_chrome` already renders each segment
# in three tiers (nerd icon / portable symbol / plain ASCII), so a glyph baked
# into a translated literal would need 3 translations per locale instead of 1
# and would break the ASCII preset's `is_ascii()` assertion.
#
# The hook is deliberately commented out rather than shipped as an identity
# entry, because an active key with no call site is an orphan that the CI gate
# would flag. To translate a prefix: move its line out of this comment block
# and add the `t!()` call at the site in `src/status_line.rs`.
#
# login_flow-style identity default is the symbol itself, so enabling a
# translation is a one-line edit and disabling it restores the symbol.
#
# status_line_prefix_git:
#   en: "git:"
#   zh-CN: "分支:"
# status_line_prefix_ctx:
#   en: "ctx:"
#   zh-CN: "上下文:"
# status_line_prefix_think:
#   en: "think:"
#   zh-CN: "思考:"
# status_line_prefix_agents:
#   en: "agents:"
#   zh-CN: "子代理:"
# status_line_prefix_session:
#   en: "session:"
#   zh-CN: "会话:"
