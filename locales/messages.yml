# RecurAgent TUI strings.
#
# _version: 2 keeps every locale side by side on one key, so a reviewer sees the
# English and the Chinese on the same screen and the two sets cannot drift into
# different key sets without the file looking obviously wrong. The CI parity
# gate (`scripts/check_i18n_keys.py`) enforces that mechanically.
#
# KEY CONVENTION: `{module}_{slug}` — symbolic, never the English source text.
# Consequence worth remembering: a missing key renders as the KEY itself
# (`login_flow_logout_absent`), not as English. There is no silent fallback to
# the literal, which is exactly why the parity gate is mandatory rather than
# nice-to-have.
#
# Multi-line values use double-quoted scalars with `\n` escapes rather than `|`
# block scalars: a block scalar's trailing-newline behaviour (`|` vs `|-` vs
# `|+`) is easy to get wrong by one byte, and these strings are handed straight
# to the terminal.
#
# PLACEHOLDERS use rust-i18n's `%{name}` form, supplied as `t!("key", name = x)`.
_version: 2

